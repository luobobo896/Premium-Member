server:
  port: ${C_SERVER_PORT:8081}

spring:
  application:
    name: premium-member-c-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:2}
      timeout: 2s

app:
  jwt:
    access-secret: ${C_JWT_ACCESS_SECRET:}
    refresh-secret: ${C_JWT_REFRESH_SECRET:}
    issuer: premium-member-c
    access-ttl: ${C_JWT_ACCESS_TTL:2h}
    refresh-ttl: ${C_JWT_REFRESH_TTL:30d}
  cookie:
    name: c_refresh
    path: ${C_COOKIE_PATH:/c/auth}
    secure: ${C_COOKIE_SECURE:false}
    max-age: ${C_JWT_REFRESH_TTL:30d}
  benefit:
    card-secret: ${BENEFIT_CARD_SECRET:premium-member-dev-only-card-secret}
  payment:
    wechat:
      mch-id: ${WECHAT_PAY_MCH_ID:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      serial-no: ${WECHAT_PAY_SERIAL_NO:}
  ai:
    provider: ${AI_PROVIDER:mock}
    storage-dir: ${AI_STORAGE_DIR:./data/ai}
    public-asset-base-url: ${PUBLIC_ASSET_BASE_URL:}
    expose-ttl-seconds: ${AI_EXPOSE_TTL_SECONDS:600}
    expose-downloads: ${AI_EXPOSE_DOWNLOADS:3}
    signed-url-ttl-seconds: ${AI_SIGNED_URL_TTL_SECONDS:1800}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      prefix: ${OSS_PREFIX:premium-member/ai}
      path-style: ${OSS_PATH_STYLE:false}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      image-model: ${DASHSCOPE_IMAGE_MODEL:wanx2.1-t2i-turbo}
      edit-model: ${DASHSCOPE_EDIT_MODEL:wanx2.1-imageedit}
      video-model: ${DASHSCOPE_VIDEO_MODEL:wan2.5-i2v-preview}
      poll-interval: ${DASHSCOPE_POLL_INTERVAL:3s}
      image-timeout: ${DASHSCOPE_IMAGE_TIMEOUT:2m}
      video-timeout: ${DASHSCOPE_VIDEO_TIMEOUT:10m}
  points:
    photo-price: ${POINTS_PHOTO_PRICE:100}
    dressup-price: ${POINTS_DRESSUP_PRICE:100}
    video-price: ${POINTS_VIDEO_PRICE:500}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
