spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:15432}/${DB_NAME:premium_member}
    username: ${DB_USER:premium_member}
    password: ${DB_PASSWORD:premium_member_dev_only}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

logging:
  level:
    com.premium.member: debug
