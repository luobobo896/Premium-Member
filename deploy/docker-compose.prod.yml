name: premium-member-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: premium-member-prod-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../admin-server/admin-bootstrap/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-admin-schema.sql:ro
      - ../admin-server/admin-bootstrap/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-admin-data.sql:ro
      - ../c-server/c-bootstrap/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/03-c-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  redis:
    image: redis:8.2-alpine
    container_name: premium-member-prod-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  admin-server:
    build:
      context: ..
      dockerfile: deploy/docker/admin-server.Dockerfile
    image: premium-member/admin-server:prod
    container_name: premium-member-prod-admin-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: ${ADMIN_REDIS_DATABASE:-1}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      BENEFIT_CARD_SECRET: ${BENEFIT_CARD_SECRET:?BENEFIT_CARD_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${ADMIN_CORS_ALLOWED_ORIGINS:?ADMIN_CORS_ALLOWED_ORIGINS is required}
      CACHE_PREFIX: ${CACHE_PREFIX:-pm:prod}
      COOKIE_SECURE: "true"
      LOG_JSON_FORMAT: ${LOG_JSON_FORMAT:-}
      JAVA_OPTS: ${ADMIN_JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5320"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5320/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

  c-server:
    build:
      context: ..
      dockerfile: deploy/docker/c-server.Dockerfile
    image: premium-member/c-server:prod
    container_name: premium-member-prod-c-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: ${C_REDIS_DATABASE:-2}
      C_JWT_ACCESS_SECRET: ${C_JWT_ACCESS_SECRET:?C_JWT_ACCESS_SECRET is required}
      C_JWT_REFRESH_SECRET: ${C_JWT_REFRESH_SECRET:?C_JWT_REFRESH_SECRET is required}
      BENEFIT_CARD_SECRET: ${BENEFIT_CARD_SECRET:?BENEFIT_CARD_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${C_CORS_ALLOWED_ORIGINS:?C_CORS_ALLOWED_ORIGINS is required}
      C_COOKIE_PATH: ${C_COOKIE_PATH:-/c-api/c/auth}
      C_COOKIE_SECURE: "true"
      SQL_INIT_MODE: never
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_STORAGE_DIR: /app/data/ai
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      DASHSCOPE_IMAGE_MODEL: ${DASHSCOPE_IMAGE_MODEL:-wanx2.1-t2i-turbo}
      DASHSCOPE_EDIT_MODEL: ${DASHSCOPE_EDIT_MODEL:-wanx2.1-imageedit}
      DASHSCOPE_VIDEO_MODEL: ${DASHSCOPE_VIDEO_MODEL:-wan2.5-i2v-preview}
      AI_EXPOSE_TTL_SECONDS: ${AI_EXPOSE_TTL_SECONDS:-600}
      AI_EXPOSE_DOWNLOADS: ${AI_EXPOSE_DOWNLOADS:-3}
      AI_SIGNED_URL_TTL_SECONDS: ${AI_SIGNED_URL_TTL_SECONDS:-1800}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PREFIX: ${OSS_PREFIX:-premium-member/ai/prod}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      LOG_JSON_FORMAT: ${LOG_JSON_FORMAT:-}
      JAVA_OPTS: ${C_JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom}
    volumes:
      - ai-data:/app/data/ai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

  admin-web:
    build:
      context: ..
      dockerfile: deploy/docker/admin-web.Dockerfile
    image: premium-member/admin-web:prod
    container_name: premium-member-prod-admin-web
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  c-h5:
    build:
      context: ..
      dockerfile: deploy/docker/c-h5.Dockerfile
    image: premium-member/c-h5:prod
    container_name: premium-member-prod-c-h5
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  nginx:
    build:
      context: ..
      dockerfile: deploy/docker/gateway.Dockerfile
    image: premium-member/gateway:prod
    container_name: premium-member-prod-nginx
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      admin-server:
        condition: service_healthy
      c-server:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      c-h5:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

volumes:
  pgdata:
  redisdata:
  ai-data:
