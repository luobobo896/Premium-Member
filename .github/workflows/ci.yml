name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [admin-server, c-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn -B package

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: admin-web/pnpm-lock.yaml
      - name: Install and build
        working-directory: admin-web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:antd

  c-h5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: c-h5/package-lock.json
      - name: Install and build
        working-directory: c-h5
        run: |
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, admin-web, c-h5]
    strategy:
      matrix:
        include:
          - name: admin-server
            dockerfile: deploy/docker/admin-server.Dockerfile
          - name: c-server
            dockerfile: deploy/docker/c-server.Dockerfile
          - name: admin-web
            dockerfile: deploy/docker/admin-web.Dockerfile
          - name: c-h5
            dockerfile: deploy/docker/c-h5.Dockerfile
          - name: gateway
            dockerfile: deploy/docker/gateway.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
