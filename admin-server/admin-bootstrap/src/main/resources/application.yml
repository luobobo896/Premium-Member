server:
  port: ${ADMIN_SERVER_PORT:5320}
  servlet:
    context-path: /api

spring:
  application:
    name: premium-member-admin-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    issuer: premium-member-admin
    access-ttl: ${JWT_ACCESS_TTL:2h}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
  cookie:
    name: jwt
    path: /api
    secure: ${COOKIE_SECURE:false}
    max-age: ${JWT_REFRESH_TTL:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5666,http://127.0.0.1:5666}
  cache-prefix: ${CACHE_PREFIX:pm:dev}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
